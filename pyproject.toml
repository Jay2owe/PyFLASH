[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyFLASH-analysis"
version = "0.2.0"
description = "ImageJ confocal microscopy data processing and analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jamie Malcolm", email = "jamiemalcolm12@gmail.com" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "immunofluorescence",
    "microscopy",
    "imagej",
    "confocal",
    "analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "reprofig>=0.5.1",
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-posthocs>=0.9",
    "scikit-learn>=1.2",   # PCA / clustering of marker profiles
    "openpyxl>=3.0",
    "read-roi>=1.6",
    "Pillow>=9.0",
]

[project.optional-dependencies]
windows = ["pywin32"]
ui = ["streamlit>=1.36", "pyyaml>=6"]   # pyyaml needed by run_spec for YAML specs
spatial = ["pointpats>=2.4"]            # Ripley's K / spatial point-pattern stats
estimation = ["dabest>=2024.3"]         # Gardner-Altman estimation plots
# The agent chassis behind the /pyflash skill: run records, the resident
# caching worker, the reproducibility notebook, the two-write audit index.
# Optional on purpose. PyFLASH itself never imports it -- the package must
# stay installable from PyPI by someone who has never heard of the kit, and
# the house style lives in PyFLASH.aesthetics rather than being borrowed from
# it. tests/test_style_conformance.py pins the two together where both exist.
agent = ["analysis-kit>=0.1.0"]

[project.scripts]
pyflash-ui = "PyFLASH.ui:main"
pyflash-figure = "PyFLASH.publication:main"

[project.urls]
Homepage = "https://github.com/Jay2owe/PyFLASH"
Documentation = "https://pyflash.readthedocs.io/"
Repository = "https://github.com/Jay2owe/PyFLASH"
Issues = "https://github.com/Jay2owe/PyFLASH/issues"

[tool.setuptools.packages.find]
include = ["PyFLASH", "PyFLASH.*"]
exclude = ["tests", "tests.*"]
