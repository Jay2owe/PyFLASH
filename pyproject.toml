[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyFLASH-analysis"
version = "0.2.0"
description = "ImageJ confocal microscopy data processing and analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jamie Malcolm", email = "jamiemalcolm12@gmail.com" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "immunofluorescence",
    "microscopy",
    "imagej",
    "confocal",
    "analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "packaging>=23",
    "psutil>=5.9",
    "reprofig>=0.5.1,<0.6",
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scipy>=1.11",
    "mpmath>=1.3",         # Resolve angular-deviation rank ties at high precision
    "statsmodels>=0.14",
    "scikit-posthocs>=0.9",
    "scikit-learn>=1.2",   # PCA / clustering of marker profiles
    "openpyxl>=3.0",
    "XlsxWriter>=3.0",     # Engine used by the public spreadsheet exports
    "read-roi>=1.6",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ijson>=3.4,<4"] # Tests and streaming validation-evidence audits
ai = ["ai-ify[web]>=0.5.0,<0.6", "httpx>=0.27", "websockets>=14,<16"]
classification = ["mord>=0.7,<0.8"] # Optional ordinal classifier
windows = ["pywin32"]
ui = ["streamlit>=1.58", "pyyaml>=6"]   # Tested component API for continuous interactive function cards
spatial = ["pointpats>=2.4"]            # Ripley's K / spatial point-pattern stats
interactive = ["plotly>=5.24"]         # Offline, movable three-dimensional scatter views
# The agent chassis behind the /pyflash skill: run records, the resident
# caching worker, the reproducibility notebook, the two-write audit index.
# Optional on purpose. PyFLASH itself never imports it -- the package must
# stay installable from PyPI by someone who has never heard of the kit, and
# the house style lives in PyFLASH.aesthetics rather than being borrowed from
# it. tests/test_style_conformance.py pins the two together where both exist.
agent = ["analysis-kit>=0.1.0,<0.2"]

[project.scripts]
pyflash-ui = "PyFLASH.ui:main"
pyflash-figure = "PyFLASH.publication:main"
pyflash-run = "PyFLASH.control:main"

[project.urls]
Homepage = "https://github.com/Jay2owe/PyFLASH"
Documentation = "https://pyflash.readthedocs.io/"
Repository = "https://github.com/Jay2owe/PyFLASH"
Issues = "https://github.com/Jay2owe/PyFLASH/issues"

[tool.setuptools.packages.find]
include = ["PyFLASH", "PyFLASH.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
PyFLASH = ["aiify_map.md", "aiify_prepared/*", "README_AI.md", "pyflash_context.json", "ui/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-plugin-autoload"
markers = ["slow: expensive scientific rendering or end-to-end processing"]
