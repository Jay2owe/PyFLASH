name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine pytest
          python -m pip install .
          python -m pytest tests/test_miniexperiment.py tests/test_association_coefficients.py tests/test_association_correlations.py tests/test_aesthetics.py tests/test_dataframe_adapter.py tests/test_context.py tests/test_reprofig_integration.py -q
          python -m build
          python -m twine check dist/*
          python -m pip install --no-deps --force-reinstall dist/*.whl
          (cd "$RUNNER_TEMP" && python -c "import PyFLASH; from importlib.metadata import version; assert PyFLASH.__version__ == version('PyFLASH-analysis'); print('Installed wheel:', PyFLASH.__version__, PyFLASH.__file__)")
          sha256sum dist/*
      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PyFLASH-analysis
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
