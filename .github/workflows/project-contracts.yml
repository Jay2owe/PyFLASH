name: Development contracts

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  project-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package and declared check dependencies
        run: python -m pip install -e '.[ui,classification]' -r reproducibility/requirements.txt -r scripts/contracts-requirements.txt
      - name: Check architecture, live catalogues, saved edits and scientific references
        run: python scripts/verify.py --group release --json
