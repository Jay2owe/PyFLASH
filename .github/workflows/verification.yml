name: Scientific regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-references-and-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package and verification dependencies
        run: python -m pip install -e '.[ui,classification]' -r reproducibility/requirements.txt -r scripts/contracts-requirements.txt pytest
      - name: Check independently frozen answers and interruption recovery
        env:
          MPLBACKEND: Agg
        run: >-
          python -m pytest tests/test_independent_references.py
          tests/test_bootstrap_reference.py
          tests/test_bootstrap_options_contract.py
          tests/test_scale_interval_contract.py
          tests/test_anderson_contract.py tests/test_association_specs_contract.py
          tests/test_normality_parent_complete_contract.py
          tests/test_group_normality_boundary_contract.py
          tests/test_group_pipeline_bar_execution.py
          tests/test_comparison_parent_inference_contract.py
