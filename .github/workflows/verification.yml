          tests/test_linear_forest_native_drawing.py
          tests/test_linear_forest_uncertainty.py
          tests/test_linear_forest_report_failures.py
          tests/test_linear_forest_probability_gates.py -q
      - name: Check native association intervals and reproducibility resources
        env:
          MPLBACKEND: Agg
        run: python scripts/verify.py --group release --check association-confidence-levels --json
      - name: Check direct CSV exports and unavailable Fisher inference
        env:
          MPLBACKEND: Agg
        run: python scripts/verify.py --group release --check direct-exports-and-inference-boundaries --json
      - name: Check exact subject identifiers through both table constructors
        env:
          MPLBACKEND: Agg
        run: python scripts/verify.py --group release --check exact-subject-identifiers --json
