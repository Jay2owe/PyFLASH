  "boundaries": [
    {
      "id": "core-without-interface-or-private-kit",
      "sources": [
        "PyFLASH/*.py"
      ],
      "forbidden": [
        "streamlit",
        "fastapi",
        "analysis_kit"
      ]
    },
    {
      "id": "science-without-browser-adapters",
      "sources": [
        "PyFLASH/*.py"
      ],
      "forbidden": [
        "PyFLASH.ui"
      ],
      "exceptions": [
        {
          "path": "PyFLASH/actions.py",
          "import": "PyFLASH.ui.catalogue",
          "reason": "Public action metadata reuses the source-derived, headless function catalogue."
        },
        {
          "path": "PyFLASH/actions.py",
          "import": "PyFLASH.ui.services",
          "reason": "The public dispatcher converts condition inputs through the existing headless adapter."
        },
        {
          "path": "PyFLASH/actions.py",
          "import": "PyFLASH.ui.project_io",
          "reason": "The public dispatcher restores the existing versioned project object."
        },
        {
          "path": "PyFLASH/control.py",
          "import": "PyFLASH.ui",
          "reason": "The command-line driver shares headless parameter descriptions, workspace state and operation receipts with the browser. It is not numerical analysis."
        },
        {
          "path": "PyFLASH/queue.py",
          "import": "PyFLASH.ui",
          "reason": "The resumable queue shares versioned project restoration and headless workspace loading. It is not numerical analysis."
        }
      ]
    },
    {
      "id": "headless-service-adapter",
      "sources": [
        "PyFLASH/ui/services.py",
        "PyFLASH/ui/project_io.py"
      ],
      "forbidden": [
        "streamlit"
      ]
    }
  ],
